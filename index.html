<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoalXO · Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;800&display=swap">
<style>
/*
  GoalXO overlay for TikTok Live Studio (link source), transparent background.
  A band that tells a tiny funny story about the game, ends on goalxo.fun + the App Store, hides, loops.
  URL options (built by editor.html): ?style=score|var|chat ?lang=fr|en|es ?name=<pseudo> ?show=15 ?hide=30 ?theme=light ?preview
  Drawn at 1000 × 180 px, scaled to fill the source.
*/
:root { color-scheme: light; --brand: #c8ff3d; --lime: #c8ff3d; --ink: #0b0f05; --band: rgba(9, 12, 16, .88); --text: #f2f4f6; --muted: #9aa3ae; --chip: rgba(255, 255, 255, .08); }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
body.preview { background: repeating-conic-gradient(#3a3f47 0 25%, #2a2e35 0 50%) 0 0 / 32px 32px; }
.stage { position: fixed; left: 0; top: 0; width: 1000px; height: 180px; transform-origin: 0 0; }
.band {
  position: absolute; inset: 18px 20px; display: flex; align-items: center; gap: 22px; padding: 0 26px 0 0;
  border-radius: 30px; background: var(--band); border: 1.5px solid rgba(200, 255, 61, .28);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06);
  font-family: Inter, system-ui, sans-serif; color: var(--text); overflow: hidden;
  transform: translateY(40px) scale(.92); opacity: 0;
  transition: transform .45s cubic-bezier(.3, 1.5, .5, 1), opacity .25s;
}
.on .band { transform: none; opacity: 1; }
.light { --band: rgba(255, 255, 255, .95); --text: #0b0f05; --muted: #5d6570; --lime: #4f8a00; --chip: rgba(11, 15, 5, .06); }
.light .band { border-color: rgba(11, 15, 5, .12); box-shadow: 0 10px 34px rgba(0, 0, 0, .18); }

/* The GOALXO block on the left, like a TV channel's bug. */
.bug { flex: none; align-self: stretch; width: 150px; display: grid; place-items: center; background: var(--brand); color: var(--ink);
  font: 400 50px/.9 'Bebas Neue', sans-serif; letter-spacing: .02em; text-align: center; }
.bug small { display: block; font: 800 13px/1 Inter, sans-serif; letter-spacing: .14em; opacity: .7; margin-top: 4px; }

/* Lines that roll to the next one. */
.roll { position: relative; overflow: hidden; }
.roll > * { position: absolute; left: 0; right: 0; top: 0; white-space: nowrap; transition: transform .32s cubic-bezier(.3, 1.4, .5, 1), opacity .2s; }
.roll > .in { transform: translateY(100%); opacity: 0; }
.roll > .out { transform: translateY(-100%); opacity: 0; }
.main { height: 58px; font: 400 58px/1 'Bebas Neue', sans-serif; letter-spacing: .02em; text-transform: uppercase; }
.sub { height: 26px; margin-top: 4px; font: 600 20px/26px Inter, sans-serif; color: var(--muted); }
.lime { color: var(--lime); }
.store { display: inline-flex; align-items: center; gap: 8px; padding: 0 12px 0 8px; height: 26px; border-radius: 9px; background: var(--text); color: var(--band);
  font: 800 15px/1 Inter, sans-serif; vertical-align: top; }
.light .store { color: #fff; }
.store svg { width: 16px; height: 16px; }
.say { flex: 1; min-width: 0; }

/* ---- Score: a TV scoreboard, the streamer scores again, the chat is told to equalise. ---- */
.s-score .band { gap: 18px; }
.s-score .bug { width: 120px; font-size: 42px; }
.s-score .main { height: 48px; font-size: 46px; }
.s-score .sub { font-size: 17px; }
.board { flex: none; display: flex; align-items: center; gap: 10px; height: 64px; padding: 0 12px; border-radius: 16px; background: var(--chip); }
.team { font: 800 16px/1 Inter, sans-serif; letter-spacing: .05em; text-transform: uppercase; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score { display: flex; align-items: center; gap: 4px; font: 400 46px/1 'Bebas Neue', sans-serif; }
.score b { font-weight: 400; display: inline-block; min-width: 22px; text-align: center; }
.score i { font-style: normal; opacity: .5; }
.score b.pop { animation: pop .5s cubic-bezier(.3, 1.8, .5, 1); color: var(--lime); }
@keyframes pop { 0% { transform: translateY(-60%) scale(.4); opacity: 0; } }
.clock { font: 800 13px/1 Inter, sans-serif; padding: 5px 7px; border-radius: 8px; background: #fe2c55; color: #fff; }
.goal .band { animation: shake .45s; }
.goal .band::before { content: ''; position: absolute; inset: 0; background: radial-gradient(60% 120% at 40% 50%, rgba(200, 255, 61, .35), transparent 70%); animation: flash .9s ease-out forwards; pointer-events: none; }
@keyframes shake { 20% { transform: translateX(-6px) rotate(-.6deg); } 40% { transform: translateX(6px) rotate(.6deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes flash { to { opacity: 0; } }
.ball { position: absolute; width: 34px; height: 34px; left: 130px; top: 50%; margin-top: -17px; font-size: 30px; line-height: 34px; opacity: 0; }
.goal .ball { animation: shot .7s cubic-bezier(.2, .7, .3, 1); }
@keyframes shot { 0% { opacity: 1; transform: translate(0, 30px) rotate(0) scale(.6); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(330px, -10px) rotate(540deg) scale(1.1); } }

/* ---- VAR: the referee draws the screen, checks the streamer, the verdict is GoalXO. ---- */
.var { flex: none; position: relative; width: 150px; align-self: stretch; display: grid; place-items: center; background: #11161c; }
.light .var { background: #0b0f05; }
.var svg { width: 112px; height: 84px; overflow: visible; }
.var rect { fill: none; stroke: #fff; stroke-width: 6; stroke-linejoin: round; stroke-dasharray: 340; stroke-dashoffset: 340; }
.on .var rect { animation: draw .9s .25s ease-in-out forwards; }
.var.ok rect { stroke: var(--brand); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.var text { font: 400 34px 'Bebas Neue', sans-serif; letter-spacing: .06em; fill: #fff; }
.var.ok text { fill: var(--brand); }
.scan { position: absolute; left: 22px; right: 22px; height: 3px; top: 50%; background: var(--brand); box-shadow: 0 0 12px var(--brand); opacity: 0; }
.var.checking .scan { animation: scan 1s ease-in-out infinite alternate; }
@keyframes scan { from { opacity: 1; transform: translateY(-34px); } to { opacity: 1; transform: translateY(34px); } }
.stamp { position: absolute; right: 26px; top: 50%; margin-top: -40px; width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center;
  background: var(--brand); color: var(--ink); font: 400 46px/1 'Bebas Neue', sans-serif; transform: scale(2.4) rotate(-30deg); opacity: 0; }
.stamped .stamp { transition: transform .35s cubic-bezier(.3, 1.6, .5, 1), opacity .15s; transform: rotate(-12deg); opacity: 1; }
.s-var .say { padding-right: 90px; }

/* ---- Tchat: the chat asks what the game is, the streamer answers. ---- */
.s-chat .band { padding: 0 22px; gap: 18px; }
.feed { flex: 1; min-width: 0; align-self: stretch; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 8px 0; overflow: hidden; }
.msg { display: flex; align-items: center; gap: 12px; flex: none; animation: rise .35s cubic-bezier(.3, 1.5, .5, 1) both; }
@keyframes rise { from { transform: translateY(40px) scale(.9); opacity: 0; } }
.msg .av { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 800 18px/1 Inter, sans-serif; color: var(--ink); }
.msg .bub { min-width: 0; padding: 5px 14px 6px; border-radius: 18px; background: var(--chip); }
.msg .who { display: block; font: 800 12px/1.2 Inter, sans-serif; color: var(--muted); }
.msg .txt { display: block; font: 800 21px/1.2 Inter, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg.me .bub { background: rgba(200, 255, 61, .16); }
.light .msg.me .bub { background: rgba(110, 170, 0, .16); }
.msg.cta .bub { background: var(--brand); color: var(--ink); display: flex; align-items: center; gap: 14px; }
.msg.cta .txt { font: 400 38px/1 'Bebas Neue', sans-serif; letter-spacing: .03em; }
.msg.cta .store { background: var(--ink); color: var(--brand); }
.dots { display: inline-flex; gap: 5px; padding: 6px 0; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: dot 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 30% { transform: translateY(-5px); opacity: 1; } 0%, 60%, 100% { opacity: .4; } }
.side { flex: none; text-align: center; font: 400 44px/.9 'Bebas Neue', sans-serif; letter-spacing: .02em; }
.side span { color: var(--lime); }
.side small { display: block; margin-top: 6px; font: 800 14px/1 Inter, sans-serif; color: var(--muted); letter-spacing: .02em; }
</style>
</head>
<body>
<div class="stage" id="stage"><div class="band" id="band"></div></div>
<script>
const APPLE_FREE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M12 7v7m-3-3 3 3 3-3"/></svg>'
const TEXT = {
  fr: {
    me: 'Streamer', them: 'Le chat', store: 'Dispo sur l’App Store',
    score: [['BUUUUT !', '⚽ Le streamer marque encore'], ['Le chat est mené 😬', 'Joueurs, carrières, scores : devine tout'], ['Égalise sur goalxo.fun', null]],
    var: [['Vérification VAR…', 'Le streamer connaît-il vraiment le foot ?'], ['Verdict : oui 😎', 'Il s’entraîne en cachette sur GoalXO'], ['8 jeux de foot', 'Devine joueurs, carrières, scores…'], ['goalxo.fun', null]],
    chat: [['supporter_42', 'c’est quoi ce jeu ??? 👀'], [null, 'GoalXO ! Tu devines joueurs, carrières, scores…'], ['ultra_du_75', 'trop facile 😤'], [null, 'Prouve-le 😏']],
  },
  en: {
    me: 'Streamer', them: 'Chat', store: 'On the App Store',
    score: [['GOOOAL!', '⚽ The streamer scores again'], ['Chat is losing 😬', 'Players, careers, scores: guess them all'], ['Equalise on goalxo.fun', null]],
    var: [['VAR check…', 'Does the streamer really know football?'], ['Verdict: yes 😎', 'Secretly training on GoalXO'], ['8 football games', 'Guess players, careers, scores…'], ['goalxo.fun', null]],
    chat: [['ultras_42', 'what is this game??? 👀'], [null, 'GoalXO! You guess players, careers, scores…'], ['bench_king', 'too easy 😤'], [null, 'Prove it 😏']],
  },
  es: {
    me: 'Streamer', them: 'El chat', store: 'Disponible en App Store',
    score: [['¡GOOOL!', '⚽ El streamer marca otra vez'], ['El chat va perdiendo 😬', 'Jugadores, carreras, marcadores…'], ['Empata en goalxo.fun', null]],
    var: [['Revisión del VAR…', '¿El streamer sabe de fútbol de verdad?'], ['Veredicto: sí 😎', 'Entrena a escondidas en GoalXO'], ['8 juegos de fútbol', 'Adivina jugadores, carreras, marcadores…'], ['goalxo.fun', null]],
    chat: [['hincha_42', '¿qué juego es este??? 👀'], [null, '¡GoalXO! Adivinas jugadores, carreras, marcadores…'], ['rey_del_banquillo', 'demasiado fácil 😤'], [null, 'Demuéstralo 😏']],
  },
}
const q = new URLSearchParams(location.search)
const T = TEXT[q.get('lang')] || TEXT.fr
const SHOW = Math.max(8, +q.get('show') || 15) * 1000
const HIDE = (+q.get('hide') || 30) * 1000
const NAME = (q.get('name') || '').trim().slice(0, 16) || T.me
const STYLE = ['score', 'var', 'chat'].includes(q.get('style')) ? q.get('style') : 'score'
const cls = document.body.classList
cls.add('s-' + STYLE)
if (q.has('preview')) cls.add('preview')
if (q.get('theme') === 'light') cls.add('light')

const stage = document.getElementById('stage')
const band = document.getElementById('band')
const fit = () => {
  const s = Math.min(innerWidth / 1000, innerHeight / 180)
  stage.style.transform = `translate(${(innerWidth - 1000 * s) / 2}px, ${(innerHeight - 180 * s) / 2}px) scale(${s})`
}
fit(); addEventListener('resize', fit)

const wait = (ms) => new Promise((r) => setTimeout(r, ms))
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const storeTag = () => `<span class="store">${APPLE_FREE_ICON}${T.store}</span>`
/** A box whose line rolls up to the next one. */
const roller = (box) => (html, extra = '') => {
  const old = box.lastElementChild
  const next = document.createElement('div')
  next.className = 'in ' + extra
  next.innerHTML = html
  box.appendChild(next)
  if (old) { old.className = 'out'; setTimeout(() => old.remove(), 350) }
  requestAnimationFrame(() => requestAnimationFrame(() => { next.className = extra }))
}
const sayBox = () => `<div class="say"><div class="roll main"></div><div class="roll sub"></div></div>`
const sayer = () => {
  const main = roller(band.querySelector('.main')), sub = roller(band.querySelector('.sub'))
  return ([m, s], last) => { main(esc(m), last ? 'lime' : ''); sub(s === null ? storeTag() : esc(s)) }
}

// Score: 1-0, the streamer scores (2-0), the chat is losing, equalise on goalxo.fun.
async function score() {
  band.innerHTML = `<div class="bug">GOAL XO<small>LIVE</small></div>
    <div class="board"><span class="team">${esc(NAME)}</span><span class="score"><b id="h">1</b><i>-</i><b>0</b></span><span class="team">${esc(T.them)}</span><span class="clock" id="clock">88'</span></div>
    ${sayBox()}<span class="ball">⚽</span>`
  const say = sayer(), h = band.querySelector('#h'), clock = band.querySelector('#clock')
  let minute = 88
  const tick = setInterval(() => { minute++; clock.textContent = minute > 90 ? `90+${minute - 90}'` : `${minute}'` }, 1400)
  await wait(700)
  cls.add('goal'); h.textContent = '2'; h.className = 'pop'
  say(T.score[0])
  await wait(1800); cls.remove('goal')
  say(T.score[1]); await wait(2000)
  say(T.score[2], true)
  return () => clearInterval(tick)
}

// VAR: the screen is drawn and scans, the verdict, the games, the site.
async function varCheck() {
  band.innerHTML = `<div class="var checking"><svg viewBox="0 0 112 84"><rect x="3" y="3" width="106" height="78" rx="10"/><text x="56" y="54" text-anchor="middle">VAR</text></svg><span class="scan"></span></div>
    ${sayBox()}<span class="stamp">XO</span>`
  const say = sayer(), screen = band.querySelector('.var')
  say(T.var[0]); await wait(2200)
  screen.className = 'var ok'; cls.add('stamped')
  say(T.var[1]); await wait(1800)
  say(T.var[2]); await wait(1800)
  say(T.var[3], true)
  return () => cls.remove('stamped')
}

// Tchat: messages come up one by one, the last one is goalxo.fun + the App Store.
async function chat() {
  band.innerHTML = `<div class="feed"></div><div class="side">GOAL<span>XO</span><small>goalxo.fun</small></div>`
  const feed = band.querySelector('.feed')
  const COLORS = ['#4d8dff', '#ec4899', '#f5a524', '#2ed3b7']
  const push = (html, kind = '') => {
    const m = document.createElement('div')
    m.className = 'msg ' + kind
    m.innerHTML = html
    feed.appendChild(m)
    while (feed.children.length > 2) feed.firstElementChild.remove()
    return m
  }
  const line = (who, text, k) => {
    const me = who === null, name = me ? NAME : who
    const color = me ? 'var(--brand)' : COLORS[k % COLORS.length]
    return [`<span class="av" style="background:${color}">${esc(name[0].toUpperCase())}</span><span class="bub"><span class="who">${esc(name)}</span><span class="txt">${esc(text)}</span></span>`, me ? 'me' : '']
  }
  let k = 0
  for (const [who, text] of T.chat) {
    const [html, kind] = line(who, text, k++)
    const typing = push(html.replace(/<span class="txt">.*<\/span><\/span>$/, '<span class="dots"><i></i><i></i><i></i></span></span>'), kind)
    await wait(650)
    typing.innerHTML = html
    await wait(1250)
  }
  push(`<span class="bub"><span class="txt">goalxo.fun</span>${storeTag()}</span>`, 'cta')
  return () => {}
}

const MODES = { score, var: varCheck, chat }
// The fonts are asked for before the first frame (fonts.ready alone resolves before any text uses them).
const fonts = ["400 50px 'Bebas Neue'", '600 20px Inter', '800 20px Inter'].map((f) => document.fonts.load(f, 'GOALXO é'))
Promise.race([Promise.all(fonts), wait(3000)]).catch(() => {}).then(async () => {
  for (;;) {
    const end = Date.now() + SHOW
    cls.add('on')
    const stop = await MODES[STYLE]()
    await wait(Math.max(1500, end - Date.now()))
    cls.remove('on')
    await wait(500)
    stop()
    band.innerHTML = ''
    await wait(HIDE)
  }
})
</script>
</body>
</html>
