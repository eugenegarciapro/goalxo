<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoalXO · Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;800&display=swap">
<style>
/*
  GoalXO overlay for TikTok Live Studio (link source), transparent background.
  A thin band: shows 15 s (logos pop in, each game is lit in turn), hides 30 s, loops.
  URL options (built by editor.html): ?lang=fr|en|es ?show=15 ?hide=30 ?theme=light ?style=compact|logos ?cta=0 ?preview
  The band is drawn at 1080 px wide and scales to the source's width.
*/
:root { color-scheme: light; --brand: #c8ff3d; --ink: #0b0f05; --band: rgba(9, 12, 16, .86); --text: #f2f4f6; --muted: #9aa3ae; }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
body.preview { background: repeating-conic-gradient(#3a3f47 0 25%, #2a2e35 0 50%) 0 0 / 32px 32px; }
.stage { position: fixed; left: 0; top: 50%; width: 1080px; height: 150px; transform-origin: 0 0; }
.band {
  position: absolute; inset: 22px 24px; display: flex; align-items: center; gap: 22px; padding: 0 22px 0 26px;
  border-radius: 28px; background: var(--band); border: 1.5px solid rgba(200, 255, 61, .28);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06);
  clip-path: inset(0 50% 0 50% round 28px); opacity: 0;
  transition: clip-path .4s cubic-bezier(.7, 0, .2, 1), opacity .2s;
  font-family: Inter, system-ui, sans-serif; color: var(--text); overflow: hidden;
}
.on .band { clip-path: inset(0 0 0 0 round 28px); opacity: 1; }
/* A lime light sweeping across as the band opens. */
.band::after {
  content: ''; position: absolute; top: 0; bottom: 0; width: 120px; left: -160px;
  background: linear-gradient(90deg, transparent, rgba(200, 255, 61, .22), transparent); transform: skewX(-18deg);
}
.on .band::after { animation: sweep .7s .2s ease-out; }
@keyframes sweep { to { left: 110%; } }

.brand { flex: none; width: 330px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.mark { font-family: 'Bebas Neue', sans-serif; font-size: 54px; line-height: .9; letter-spacing: .02em; }
.mark span { color: var(--brand); }
.label { position: relative; height: 32px; overflow: hidden; }
.label b {
  position: absolute; inset: 0; font-size: 24px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
  white-space: nowrap; transition: transform .22s cubic-bezier(.3, 1.4, .5, 1), opacity .18s;
}
.label b.out { transform: translateY(-100%); opacity: 0; }
.label b.in { transform: translateY(100%); opacity: 0; }
.cta { font-size: 18px; font-weight: 600; color: var(--muted); }
.cta em { font-style: normal; color: var(--brand); }

.games { flex: 1; display: flex; justify-content: space-between; align-items: center; height: 100%; }
.game {
  width: 66px; height: 66px; border-radius: 19px; transform: translateY(36px) scale(.4) rotate(-12deg); opacity: 0;
  transition: transform .32s cubic-bezier(.3, 1.6, .5, 1), opacity .2s, filter .2s;
}
.game svg { display: block; width: 100%; height: 100%; }
.on .game.shown { transform: none; opacity: .55; filter: saturate(.75); }
.on .game.shown.lit { transform: translateY(-3px) scale(1.12); opacity: 1; filter: none; box-shadow: 0 0 0 3px var(--band), 0 0 0 5px var(--c), 0 8px 26px -4px var(--c); }
.game.gone { transform: translateY(-30px) scale(.5) !important; opacity: 0 !important; transition-duration: .22s; }

/* Light theme: white band, dark text. */
.light { --band: rgba(255, 255, 255, .94); --text: #0b0f05; --muted: #5d6570; }
.light .band { border-color: rgba(11, 15, 5, .12); box-shadow: 0 10px 34px rgba(0, 0, 0, .18); }
.light .mark span, .light .cta em { color: #5a8f00; }
.light .band::after { background: linear-gradient(90deg, transparent, rgba(150, 210, 0, .3), transparent); }
.light.on .game.shown { opacity: .9; filter: saturate(.85); }
/* Compact: the mark only, smaller logos. */
.s-compact .stage { width: 820px; height: 120px; }
.s-compact .band { inset: 16px 20px; gap: 16px; padding: 0 18px 0 22px; border-radius: 24px; }
.s-compact .brand { width: auto; }
.s-compact .mark { font-size: 40px; }
.s-compact .label, .s-compact .cta { display: none; }
.s-compact .game { width: 60px; height: 60px; border-radius: 17px; }
/* Logos only: no band, the tiles float. */
.s-logos .stage { width: 760px; height: 120px; }
.s-logos .band { inset: 0 20px; overflow: visible; background: none; border: none; box-shadow: none; padding: 0; }
.s-logos .band::after, .s-logos .brand { display: none; }
.s-logos .game { filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .45)) !important; }
.s-logos.on .game.shown { opacity: .8; }
.s-logos.on .game.shown.lit { box-shadow: none; opacity: 1; }
.nocta .cta, .nocta .fl-site { display: none; }

/* Flash: one game at a time, big logo and big name. */
.s-flash .stage { width: 860px; height: 150px; }
.s-flash .band { gap: 24px; padding: 0 30px 0 16px; }
.fl-logo { position: relative; flex: none; width: 92px; height: 92px; }
.fl-logo .game { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 26px; opacity: 1; transform: none; transition: none; }
.fl-logo .game.in { animation: pop .34s cubic-bezier(.3, 1.6, .5, 1) both; }
.fl-logo .game.out { animation: drop .2s ease-in both; }
@keyframes pop { from { transform: scale(.3) rotate(-25deg); opacity: 0; } }
@keyframes drop { to { transform: translateY(-40px) scale(.6); opacity: 0; } }
.fl-name { flex: 1; position: relative; height: 64px; overflow: hidden; }
.fl-name b { position: absolute; inset: 0; font: 400 64px/1 'Bebas Neue', sans-serif; letter-spacing: .02em; white-space: nowrap; text-transform: uppercase;
  transition: transform .22s cubic-bezier(.3, 1.4, .5, 1), opacity .18s; }
.fl-name b.out { transform: translateY(-100%); opacity: 0; }
.fl-name b.in { transform: translateY(100%); opacity: 0; }
.fl-side { flex: none; text-align: right; }
.fl-side .mark { font-size: 46px; }
.fl-site { font-size: 18px; font-weight: 800; color: var(--brand); }
.light .fl-site { color: #5a8f00; }

/* Défilé: the games run by, the GOALXO mark stays on the left. */
.s-ticker .stage { width: 1080px; height: 130px; }
.s-ticker .band { inset: 18px 24px; padding: 0; gap: 0; }
.tk-mark { flex: none; height: 100%; display: flex; align-items: center; padding: 0 26px; background: var(--brand); color: var(--ink);
  font: 400 50px/1 'Bebas Neue', sans-serif; letter-spacing: .02em; z-index: 1; }
.tk-view { flex: 1; overflow: hidden; height: 100%; -webkit-mask: linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent); mask: linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent); }
.tk-row { display: flex; align-items: center; height: 100%; width: max-content; animation: run var(--dur, 14s) linear infinite; }
.tk-item { display: flex; align-items: center; gap: 14px; padding-right: 40px; font: 400 46px/1 'Bebas Neue', sans-serif; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
.tk-item .game { width: 54px; height: 54px; border-radius: 16px; opacity: 1; transform: none; }
.tk-item.site { color: var(--brand); }
.light .tk-item.site { color: #5a8f00; }
@keyframes run { to { transform: translateX(-50%); } }

/* Choc: a big line that flips, the logos jumping in a wave. */
.s-punch .stage { width: 1000px; height: 150px; }
.s-punch .band { gap: 20px; padding: 0 28px 0 32px; }
.pu-text { flex: 1; position: relative; height: 78px; overflow: hidden; }
.pu-text b { position: absolute; inset: 0; font: 400 78px/1 'Bebas Neue', sans-serif; letter-spacing: .02em; white-space: nowrap; text-transform: uppercase;
  transition: transform .24s cubic-bezier(.3, 1.4, .5, 1), opacity .18s; }
.pu-text b.lime { color: var(--brand); }
.light .pu-text b.lime { color: #5a8f00; }
.pu-text b.out { transform: translateY(-100%) rotateX(60deg); opacity: 0; }
.pu-text b.in { transform: translateY(100%) rotateX(-60deg); opacity: 0; }
.pu-grid { flex: none; display: grid; grid-template-columns: repeat(4, 44px); gap: 8px; }
.pu-grid .game { width: 44px; height: 44px; border-radius: 13px; }
.on .pu-grid .game.shown { opacity: 1; filter: none; animation: hop .9s ease-in-out infinite; animation-delay: calc(var(--i) * 70ms + .4s); }
@keyframes hop { 0%, 60%, 100% { transform: none; } 30% { transform: translateY(-8px) scale(1.08); } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="band">
    <div class="brand">
      <div class="mark">GOAL<span>XO</span></div>
      <div class="label" id="label"><b id="name"></b></div>
      <div class="cta" id="cta"></div>
    </div>
    <div class="games" id="games"></div>
  </div>
</div>
<script>
const INK = '#0b0f05'
const GAMES = [
  ['ttt', '#c8ff3d', `<path d="M17 22.5l9 9m0-9l-9 9" stroke="${INK}" stroke-width="5.5" stroke-linecap="round"/><circle cx="42" cy="37" r="6.2" fill="none" stroke="${INK}" stroke-width="5.5"/>`],
  ['vv', '#4d8dff', `<path d="M18 25h24m-6-6 6 6-6 6M46 39H22m6-6-6 6 6 6" fill="none" stroke="${INK}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>`],
  ['guess', '#22c55e', `<path d="M25 25a7 7 0 1 1 10 6.3c-1.9 1-3 2.4-3 4.4v1.3" fill="none" stroke="${INK}" stroke-width="5.5" stroke-linecap="round"/><circle cx="32" cy="45" r="3.4" fill="${INK}"/>`],
  ['career', '#2ed3b7', `<path d="M19 44l10-10 6 6 10-14" fill="none" stroke="${INK}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="45" cy="22" r="4.6" fill="${INK}"/>`],
  ['top10', '#b07cff', `<rect x="17" y="31" width="9" height="15" rx="2.5" fill="${INK}"/><rect x="27.5" y="18" width="9" height="28" rx="2.5" fill="${INK}"/><rect x="38" y="25" width="9" height="21" rx="2.5" fill="${INK}"/>`],
  ['xoguessr', '#38bdf8', `<path fill-rule="evenodd" fill="${INK}" d="M32 49c-6-7.4-12-14.5-12-21a12 12 0 0 1 24 0c0 6.5-6 13.6-12 21zm0-16.2a4.8 4.8 0 1 0 0-9.6 4.8 4.8 0 0 0 0 9.6z"/>`],
  ['quiz', '#f5a524', `<path fill="${INK}" d="M35.5 15 20 35h10l-3.5 14L44 29H34z" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>`],
  ['score', '#ec4899', `<rect x="15" y="22" width="13" height="20" rx="4" fill="${INK}"/><rect x="36" y="22" width="13" height="20" rx="4" fill="${INK}"/><circle cx="32" cy="28.5" r="2" fill="${INK}"/><circle cx="32" cy="35.5" r="2" fill="${INK}"/>`],
]
const TEXT = {
  fr: { cta: 'Joue gratuit sur <em>goalxo.fun</em>', all: '8 jeux de foot', free: '100 % gratuit', names: { ttt: 'Tic Tac Toe', vv: 'Vice Versa', guess: 'Devine le joueur', career: 'Devine la carrière', top10: 'Top 10', xoguessr: 'XOGuessr', quiz: 'Quiz', score: 'Devine le score' } },
  en: { cta: 'Play free on <em>goalxo.fun</em>', all: '8 football games', free: '100% free', names: { ttt: 'Tic Tac Toe', vv: 'Vice Versa', guess: 'Guess the player', career: 'Guess the career', top10: 'Top 10', xoguessr: 'XOGuessr', quiz: 'Quiz', score: 'Guess the score' } },
  es: { cta: 'Juega gratis en <em>goalxo.fun</em>', all: '8 juegos de fútbol', free: '100 % gratis', names: { ttt: 'Tic Tac Toe', vv: 'Vice Versa', guess: 'Adivina el jugador', career: 'Adivina la carrera', top10: 'Top 10', xoguessr: 'XOGuessr', quiz: 'Quiz', score: 'Adivina el marcador' } },
}
const q = new URLSearchParams(location.search)
const T = TEXT[q.get('lang')] || TEXT.fr
const SHOW = (+q.get('show') || 15) * 1000
const HIDE = (+q.get('hide') || 30) * 1000
if (q.has('preview')) document.body.classList.add('preview')

const stage = document.getElementById('stage')
const band = stage.querySelector('.band')
const cls = document.body.classList
if (q.get('theme') === 'light') cls.add('light')
const MODES = ['band', 'compact', 'logos', 'flash', 'ticker', 'punch']
const STYLE = MODES.includes(q.get('style')) ? q.get('style') : 'band'
cls.add('s-' + STYLE)
if (q.get('cta') === '0') cls.add('nocta')
const SIZES = { band: [1080, 150], compact: [820, 120], logos: [760, 120], flash: [860, 150], ticker: [1080, 130], punch: [1000, 150] }

const tile = (i, extra = '') => {
  const [, c, art] = GAMES[i]
  const d = document.createElement('div')
  d.className = 'game ' + extra
  d.style.setProperty('--c', c)
  d.style.setProperty('--i', i)
  d.innerHTML = `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="${c}"/>${art}</svg>`
  return d
}
const name = (i) => T.names[GAMES[i][0]]

// The band fills its source: it keeps its proportions and grows to the full height (or width), centred.
const fit = () => {
  const [w, h] = SIZES[STYLE]
  const s = Math.min(innerWidth / w, innerHeight / h)
  const x = (innerWidth - w * s) / 2
  const y = (innerHeight - h * s) / 2
  stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`
  stage.style.top = '0'
}
fit(); addEventListener('resize', fit)

// A line of text that rolls to the next one.
const roller = (box) => {
  let current = null
  return (text, extra = '') => {
    const next = document.createElement('b')
    next.textContent = text
    next.className = 'in ' + extra
    box.appendChild(next)
    if (current) { const old = current; old.className = 'out ' + extra; setTimeout(() => old.remove(), 300) }
    requestAnimationFrame(() => requestAnimationFrame(() => { next.className = extra }))
    current = next
  }
}

const wait = (ms) => new Promise((r) => setTimeout(r, ms))
const open = () => cls.add('on')
const close = async () => { cls.remove('on'); await wait(HIDE) }
const until = (end) => Date.now() < end

// Bandeau, Compact, Logos seuls: logos pop in, each one lit in turn (looping until the time is up), then fly off.
async function rowMode() {
  const box = document.getElementById('games')
  const say = roller(document.getElementById('label'))
  document.getElementById('cta').innerHTML = T.cta
  const tiles = GAMES.map((_, i) => box.appendChild(tile(i)))
  for (;;) {
    const end = Date.now() + SHOW
    tiles.forEach((t) => t.className = 'game')
    say(T.all)
    open()
    await wait(250)
    for (const t of tiles) { t.classList.add('shown'); await wait(40) }
    await wait(250)
    for (let i = 0; until(end - 900); i = (i + 1) % tiles.length) {
      tiles.forEach((t, j) => t.classList.toggle('lit', j === i))
      say(name(i))
      await wait(850)
    }
    tiles.forEach((t) => t.classList.add('lit'))
    say(T.all)
    await wait(500)
    for (const t of tiles) { t.classList.add('gone'); await wait(25) }
    await wait(150)
    await close()
  }
}

// Flash: one big game at a time.
async function flashMode() {
  band.innerHTML = `<div class="fl-logo"></div><div class="fl-name"></div>
    <div class="fl-side"><div class="mark">GOAL<span>XO</span></div><div class="fl-site">goalxo.fun</div></div>`
  const logo = band.querySelector('.fl-logo')
  const say = roller(band.querySelector('.fl-name'))
  for (;;) {
    const end = Date.now() + SHOW
    open()
    await wait(200)
    for (let i = 0; until(end - 300); i = (i + 1) % GAMES.length) {
      const old = logo.firstChild
      if (old) { old.className = 'game out'; setTimeout(() => old.remove(), 200) }
      logo.appendChild(tile(i, 'in'))
      say(name(i))
      await wait(1000)
    }
    await close()
    logo.innerHTML = ''
  }
}

// Défilé: the games and the site run by.
async function tickerMode() {
  const items = GAMES.map((_, i) => `<div class="tk-item">${tile(i).outerHTML}${name(i)}</div>`).join('')
    + `<div class="tk-item site">goalxo.fun</div>`
  band.innerHTML = `<div class="tk-mark">GOAL<span style="color:inherit;opacity:.7">XO</span></div><div class="tk-view"><div class="tk-row">${items}${items}</div></div>`
  const row = band.querySelector('.tk-row')
  await document.fonts.ready
  row.style.setProperty('--dur', (row.scrollWidth / 2 / 260) + 's')
  for (;;) {
    open()
    await wait(SHOW)
    await close()
  }
}

// Choc: a big line that flips between three messages, the logos jumping in a wave.
async function punchMode() {
  band.innerHTML = `<div class="pu-text"></div><div class="pu-grid"></div>`
  const grid = band.querySelector('.pu-grid')
  const tiles = GAMES.map((_, i) => grid.appendChild(tile(i)))
  const say = roller(band.querySelector('.pu-text'))
  const lines = [[T.all, ''], [T.free, ''], ['goalxo.fun', 'lime']]
  for (;;) {
    const end = Date.now() + SHOW
    tiles.forEach((t) => t.className = 'game')
    open()
    await wait(200)
    for (const t of tiles) { t.classList.add('shown'); await wait(30) }
    for (let i = 0; until(end - 300); i = (i + 1) % lines.length) {
      say(...lines[i])
      await wait(1300)
    }
    await close()
  }
}

document.fonts.ready.then({ flash: flashMode, ticker: tickerMode, punch: punchMode }[STYLE] || rowMode)
</script>
</body>
</html>
